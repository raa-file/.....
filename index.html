  --line: #DCDCD5;
  --soft: #EAEAE5;
  --accent: #2B3FE0;
  --iw: 190px;
  --font: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font);
  background: var(--paper);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.45;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ---------- header ---------- */
.header {
  position: sticky; top: 0; z-index: 30;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 16px 28px;
  background: rgba(244, 244, 241, .9);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.logo {
  grid-column: 2;
  font-weight: 800;
  font-stretch: 125%;
  font-size: 25px;
  letter-spacing: .04em;
  color: inherit;
  text-decoration: none;
  line-height: 1;
}
.tools { grid-column: 3; justify-self: end; display: flex; gap: 2px; align-items: center; }
.icon-btn {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: 50%;
  position: relative;
  transition: background .15s;
}
.icon-btn:hover { background: rgba(0, 0, 0, .06); }
.badge {
  position: absolute; top: 3px; right: 0;
  min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 9px;
  background: var(--accent); color: #fff;
  font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
}
.badge.bounce { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 40% { transform: scale(1.35); } }
.initial {
  position: absolute; inset: 7px;
  border-radius: 50%;
  background: var(--ink); color: var(--paper);
  font-size: 13px; font-weight: 700;
  display: grid; place-items: center;
}

.search-bar { grid-column: 1 / -1; padding-top: 14px; }
.search-bar input {
  width: 100%; max-width: 560px; display: block; margin: 0 auto;
  font: inherit; font-size: 16px;
  padding: 11px 16px;
  border: 1px solid var(--line); border-radius: 999px;
  background: #fff; color: var(--ink);
}
.search-bar input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

.account-wrap { position: relative; }
.pop {
  position: absolute; right: 0; top: 48px;
  width: 260px; padding: 18px;
  background: #fff; border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 14px 40px -18px rgba(0, 0, 0, .35);
}
.pop h3 { font-size: 15px; margin-bottom: 4px; }
.pop p { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.pop input {
  width: 100%; font: inherit; padding: 9px 12px; margin-bottom: 10px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--paper);
}

/* ---------- layout ---------- */
.main {
  flex: 1;
  display: grid;
  grid-template-columns: 170px minmax(0, 1fr);
  gap: 24px;
  padding: 36px 0 24px 28px;
}
.cats { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 110px; align-self: start; }
.cats button {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 9px 12px 9px 0;
  font-size: 15px; color: var(--muted);
  text-align: left;
  border-bottom: 1px solid transparent;
  transition: color .2s;
}
.cats button span { font-size: 12px; font-variant-numeric: tabular-nums; }
.cats button:hover { color: var(--ink); }
.cats button[aria-current="true"] { color: var(--ink); font-weight: 650; border-bottom-color: var(--ink); }

.rack-area { min-width: 0; }
.rack-head { display: flex; align-items: baseline; gap: 16px; padding-right: 28px; margin-bottom: 30px; }
.rack-head h1 {
  font-size: clamp(40px, 6.2vw, 84px);
  font-weight: 780;
  font-stretch: 122%;
  letter-spacing: -.01em;
  line-height: .9;
  transition: opacity .25s;
}
.count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.rail-nav { margin-left: auto; display: flex; gap: 6px; align-self: center; }
.rail-nav .icon-btn { border: 1px solid var(--line); }
.rail-nav .icon-btn:disabled { opacity: .3; cursor: default; background: none; }
.hint { color: var(--muted); font-size: 13px; padding: 8px 28px 0 0; }

/* ---------- the rail ---------- */
.rack { display: flex; flex-direction: column; gap: 10px; transition: opacity .25s; }
.rail {
  overflow-x: auto; overflow-y: hidden;
  padding-bottom: 14px;
  scrollbar-width: thin;
  scrollbar-color: #c4c4bd transparent;
  overscroll-behavior-x: contain;
}
.rail::-webkit-scrollbar { height: 6px; }
.rail::-webkit-scrollbar-thumb { background: #c4c4bd; border-radius: 3px; }
.rail-inner { position: relative; width: max-content; min-width: 100%; padding: 0 56px 0 36px; }
.rail-inner.bump { animation: bump .5s ease-out; }
@keyframes bump { 25% { transform: translateY(2px); } 55% { transform: translateY(-1px); } 80% { transform: translateY(.5px); } }

.pipe {
  position: absolute; left: 10px; right: 10px; top: 12px; height: 12px;
  border-radius: 6px;
  background: linear-gradient(180deg, #F2F4F6 0%, #C6CBD0 30%, #8C939B 62%, #B6BCC2 85%, #D7DBDF 100%);
  box-shadow: 0 8px 12px -8px rgba(0, 0, 0, .45);
}
.cap {
  position: absolute; top: -5px; width: 9px; height: 22px; border-radius: 3px;
  background: linear-gradient(90deg, #6F767E, #CBD0D4 45%, #7A8189);
}
.cap.l { left: -4px; } .cap.r { right: -4px; }

.hangers { display: flex; gap: 16px; position: relative; }

.item { width: var(--iw); flex: none; perspective: 820px; perspective-origin: 50% 40%; }
.item.drop { animation: drop .7s cubic-bezier(.2, .9, .25, 1.15) both; animation-delay: var(--d, 0ms); }
@keyframes drop { from { opacity: 0; transform: translateY(-34px); } to { opacity: 1; transform: none; } }
.rack.leaving .item { transition: opacity .2s, transform .2s; opacity: 0; transform: translateY(-14px); }

.hit {
  display: block; position: relative;
  width: 100%;
  height: calc(44px + var(--iw) * 224 / 220);
  cursor: pointer;
  touch-action: pan-x pan-y;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}
.hit:focus-visible .tag-focus { opacity: 1; }
.swing { position: absolute; inset: 0; transform-origin: 50% 18px; will-change: transform; }
.spin { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform; }
.hook { position: absolute; top: 6px; left: calc(50% - 20px); width: 40px; height: 50px; transform: translateZ(0); }
.face {
  position: absolute; left: 0; right: 0; top: 44px;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  transform: translateZ(.6px);
}
.face.back { transform: rotateY(180deg) translateZ(.6px); }
.face svg, .v-face svg { display: block; width: 100%; height: auto; overflow: visible; }
.shade { fill: #000; }

.tag-focus {
  position: absolute; left: 6px; right: 6px; bottom: -4px; height: 2px;
  background: var(--accent); opacity: 0; transition: opacity .15s;
}
.tag {
  display: flex; justify-content: space-between; gap: 10px;
  padding: 12px 4px 0;
  font-size: 13px; line-height: 1.3;
}
.tag-name { font-weight: 600; }
.tag-price { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag-name.flash { color: var(--accent); }

.empty { padding: 40px 0 60px; }
.empty p { font-size: 18px; margin-bottom: 10px; }
.link { text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; justify-content: center; align-items: center;
  height: 48px; padding: 0 22px;
  border-radius: 999px; border: 1px solid var(--ink);
  font-weight: 650; font-size: 15px;
  transition: transform .12s, background .15s, color .15s;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--ink); color: var(--paper); width: 100%; }
.btn.primary:hover { background: #2a2a2a; }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; }
.scrim { position: absolute; inset: 0; background: rgba(20, 20, 18, .38); animation: fade .25s; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  position: relative;
  width: min(940px, 100%); max-height: calc(100svh - 48px); overflow: auto;
  display: grid; grid-template-columns: 1.1fr 1fr;
  background: var(--paper);
  border-radius: 14px;
  animation: rise .35s cubic-bezier(.2, .8, .2, 1);
}
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } }
.close { position: absolute; top: 12px; right: 12px; z-index: 2; }
.viewer { background: var(--soft); padding: 36px 28px 22px; display: flex; flex-direction: column; align-items: center; border-radius: 14px 0 0 14px; }
.v-stage { width: min(360px, 100%); perspective: 1100px; cursor: grab; touch-action: pan-y; user-select: none; }
.v-stage:active { cursor: grabbing; }
.v-spin { position: relative; aspect-ratio: 220 / 224; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.25, .8, .2, 1); }
.v-spin.dragging { transition: none; }
.v-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: translateZ(.6px); }
.v-face.back { transform: rotateY(180deg) translateZ(.6px); }
.seg { display: inline-flex; margin-top: 22px; padding: 3px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); }
.seg button { padding: 7px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.v-hint { font-size: 12px; color: var(--muted); margin-top: 10px; }

.info { padding: 44px 34px 32px; display: flex; flex-direction: column; }
.info h2 { font-size: 30px; font-weight: 780; font-stretch: 115%; line-height: 1.02; letter-spacing: -.005em; padding-right: 34px; }
.m-price { font-size: 18px; margin-top: 10px; font-variant-numeric: tabular-nums; }
.m-color { display: flex; align-items: center; gap: 8px; margin-top: 18px; font-size: 14px; color: var(--muted); }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .18); }
.m-desc { margin-top: 12px; font-size: 14.5px; color: #3b3b38; max-width: 42ch; }
.sizes { border: 0; padding: 0; margin-top: 24px; }
.sizes legend { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.size-row { display: flex; gap: 8px; }
.size-row button {
  width: 52px; height: 44px; border-radius: 8px;
  border: 1px solid var(--line); background: #fff;
  font-weight: 600; font-size: 14px;
  transition: border-color .15s, background .15s, color .15s;
}
.size-row button:hover { border-color: var(--ink); }
.size-row button[aria-checked="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.qty-row { display: flex; align-items: center; justify-content: space-between; margin: 22px 0 26px; }
.qty-label { font-size: 13px; font-weight: 600; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: #fff; }
.stepper button { width: 38px; height: 38px; font-size: 18px; border-radius: 50%; }
.stepper button:hover { background: var(--soft); }
.stepper output { min-width: 26px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.stepper.sm button { width: 30px; height: 30px; font-size: 16px; }
.info .btn.primary { margin-top: auto; }

/* ---------- cart drawer ---------- */
.drawer-wrap { position: fixed; inset: 0; z-index: 60; }
.drawer {
  position: absolute; top: 0; right: 0; bottom: 0;
  width: min(420px, 100%);
  background: var(--paper);
  display: flex; flex-direction: column;
  animation: slide .35s cubic-bezier(.2, .8, .2, 1);
  box-shadow: -20px 0 50px -30px rgba(0, 0, 0, .4);
}
@keyframes slide { from { transform: translateX(100%); } }
.drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 14px 24px; border-bottom: 1px solid var(--line); }
.drawer-head h2 { font-size: 20px; font-weight: 750; font-stretch: 115%; }
.lines { list-style: none; padding: 8px 24px; overflow: auto; flex: 1; }
.line { display: grid; grid-template-columns: 72px 1fr auto; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); align-items: center; }
.line-thumb { width: 72px; height: 76px; background: var(--soft); border-radius: 8px; padding: 6px; }
.line-name { font-weight: 600; font-size: 14px; }
.line-meta { color: var(--muted); font-size: 13px; margin: 2px 0 8px; }
.line-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.line-price { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 14px; }
.remove { font-size: 12px; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
.remove:hover { color: var(--ink); }
.drawer-empty { padding: 40px 24px; flex: 1; }
.drawer-empty p { margin-bottom: 18px; font-size: 15px; }
.drawer-foot { padding: 18px 24px calc(22px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.total { display: flex; justify-content: space-between; font-size: 16px; }
.total strong { font-variant-numeric: tabular-nums; }
.note { color: var(--muted); font-size: 12.5px; margin: 4px 0 14px; }
.done { padding: 40px 24px; }
.done h3 { font-size: 22px; font-stretch: 115%; margin-bottom: 8px; }
.done p { color: var(--muted); margin-bottom: 18px; }

/* ---------- toast & footer ---------- */
.toast {
  position: fixed; left: 50%; bottom: 26px; z-index: 70;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--paper);
  padding: 11px 18px; border-radius: 999px; font-size: 14px; font-weight: 550;
  transition: opacity .25s, transform .25s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.footer { padding: 18px 28px 26px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); }

/* ---------- mobile ---------- */
@media (max-width: 759px) {
  :root { --iw: calc((100vw - 60px) / 2); }
  .header { padding: 12px 14px; }
  .logo { font-size: 21px; }
  .main { grid-template-columns: 1fr; gap: 0; padding: 0 0 20px; }
  .cats {
    position: sticky; top: 65px; z-index: 20;
    flex-direction: row; gap: 6px; overflow-x: auto;
    padding: 12px 14px; background: rgba(244, 244, 241, .94);
    scrollbar-width: none;
  }
  .cats::-webkit-scrollbar { display: none; }
  .cats button {
    flex: none; padding: 7px 14px; gap: 6px;
    border: 1px solid var(--line); border-radius: 999px; font-size: 14px;
  }
  .cats button[aria-current="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .rack-head { padding: 14px 16px 0; margin-bottom: 22px; }
  .rail-nav { display: none; }
  .rack { gap: 18px; }
  .rail { overflow: visible; padding-bottom: 0; }
  .rail-inner { width: auto; padding: 0 12px; }
  .pipe { left: 6px; right: 6px; }
  .hangers { justify-content: center; gap: 12px; }
  .hit { touch-action: pan-y; }
  .hint { padding: 14px 16px 0; }
  .footer { padding: 18px 16px 26px; }

  .modal { padding: 0; place-items: end stretch; }
  .sheet { grid-template-columns: 1fr; border-radius: 18px 18px 0 0; max-height: 92svh; animation-name: up; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .viewer { border-radius: 18px 18px 0 0; padding: 28px 20px 16px; }
  .v-stage { width: min(280px, 78vw); }
  .info { padding: 22px 20px calc(22px + env(safe-area-inset-bottom)); }
  .info h2 { font-size: 24px; }
  .size-row button { flex: 1; width: auto; }
}

@media (prefers-reduced-motion: reduce) {
  .item.drop, .rail-inner.bump, .badge.bounce, .sheet, .drawer, .scrim { animation: none; }
  .v-spin { transition-duration: .01s; }
}

@media (min-width: 1280px) { :root { --iw: 214px; } }

</style>
</head>
<body>

<header class="header">
  <div class="header-side"></div>
  <a class="logo" href="./" aria-label="HANGR home">HANGR</a>
  <div class="tools">
    <button class="icon-btn" id="searchBtn" aria-label="Search" aria-expanded="false" aria-controls="searchBar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    </button>
    <div class="account-wrap">
      <button class="icon-btn" id="accountBtn" aria-label="Account" aria-expanded="false" aria-controls="accountPop">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        <span class="initial" id="initial" hidden></span>
      </button>
      <div class="pop" id="accountPop" hidden></div>
    </div>
    <button class="icon-btn" id="cartBtn" aria-label="Cart, 0 items" aria-controls="cart">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 8h14l-1.2 12.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8L5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8" stroke-linecap="round"/></svg>
      <span class="badge" id="badge" hidden>0</span>
    </button>
  </div>
  <div class="search-bar" id="searchBar" hidden>
    <label class="sr" for="searchInput">Search pieces</label>
    <input id="searchInput" type="search" placeholder="Search by name or color" autocomplete="off">
  </div>
</header>

<main class="main">
  <nav class="cats" id="cats" aria-label="Categories"></nav>

  <section class="rack-area" aria-labelledby="rackTitle">
    <div class="rack-head">
      <h1 id="rackTitle">All</h1>
      <p class="count" id="rackCount"></p>
      <div class="rail-nav">
        <button class="icon-btn" id="prevBtn" aria-label="Scroll rail left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="icon-btn" id="nextBtn" aria-label="Scroll rail right"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
    <div class="rack" id="rack"></div>
    <p class="hint" id="hint">Hover over a piece to turn it. Click to see it up close.</p>
  </section>
</main>

<footer class="footer">Demo store. Prices in SAR. Nothing is charged.</footer>

<!-- Product details -->
<div class="modal" id="modal" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mName">
    <button class="icon-btn close" data-close aria-label="Close details">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div class="viewer">
      <div class="v-stage" id="vStage">
        <div class="v-spin" id="vSpin">
          <div class="v-face front" id="vFront"></div>
          <div class="v-face back" id="vBack"></div>
        </div>
      </div>
      <div class="seg" role="group" aria-label="Choose view">
        <button data-side="front" aria-pressed="true">Front</button>
        <button data-side="back" aria-pressed="false">Back</button>
      </div>
      <p class="v-hint">Drag to turn</p>
    </div>
    <div class="info">
      <h2 id="mName"></h2>
      <p class="m-price" id="mPrice"></p>
      <p class="m-color"><span class="dot" id="mDot"></span><span id="mColor"></span></p>
      <p class="m-desc" id="mDesc"></p>
      <fieldset class="sizes">
        <legend>Size</legend>
        <div class="size-row" id="sizeRow"></div>
      </fieldset>
      <div class="qty-row">
        <span class="qty-label" id="qtyLabel">Quantity</span>
        <div class="stepper" role="group" aria-labelledby="qtyLabel">
          <button id="qMinus" aria-label="Decrease quantity">−</button>
          <output id="qVal" aria-live="polite">1</output>
          <button id="qPlus" aria-label="Increase quantity">+</button>
        </div>
      </div>
      <button class="btn primary" id="addBtn">Add to Cart</button>
    </div>
  </div>
</div>

<!-- Cart -->
<div class="drawer-wrap" id="cartWrap" hidden>
  <div class="scrim" data-cart-close></div>
  <aside class="drawer" id="cart" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
    <div class="drawer-head">
      <h2 id="cartTitle">Cart</h2>
      <button class="icon-btn" data-cart-close aria-label="Close cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <ul class="lines" id="lines"></ul>
    <div class="drawer-empty" id="cartEmpty" hidden>
      <p>Your cart is empty. Pick something off the rail.</p>
      <button class="btn" data-cart-close>Browse the rail</button>

    <div class="drawer-foot" id="cartFoot">

    r = Math.round(r + (t - r) * a);

<script>
/* HANGR — app */
(function () {
  'use strict';
  const { PRODUCTS, CATEGORIES, garment, HOOK } = window.HANGR;
  const $ = (s, r = document) => r.querySelector(s);

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const SIZES = ['S', 'M', 'L', 'XL'];

  /* ---------- storage (safe) ---------- */
  const store = {
    get(k, f) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch (e) { return f; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } },
  };

  const state = {
    cat: 'all',
    q: '',
    cart: store.get('hangr-cart', []).filter((l) => byId[l.id]),
    user: store.get('hangr-user', null),
  };

  const mqMobile = matchMedia('(max-width: 759px)');
  const mqReduce = matchMedia('(prefers-reduced-motion: reduce)');
  const coarse = matchMedia('(hover: none)');
  let mobile = mqMobile.matches;

  /* =========================================================
     Categories
     ========================================================= */
  function renderCats() {
    $('#cats').innerHTML = CATEGORIES.map((c) => {
      const n = c.id === 'all' ? PRODUCTS.length : PRODUCTS.filter((p) => p.cat === c.id).length;
      return `<button data-cat="${c.id}" aria-current="${c.id === state.cat}">${c.label}<span>${n}</span></button>`;
    }).join('');
  }
  $('#cats').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-cat]');
    if (!b || b.dataset.cat === state.cat) return;
    state.cat = b.dataset.cat;
    renderCats();
    swapRack();
  });

  function visible() {
    const q = state.q.trim().toLowerCase();
    return PRODUCTS.filter((p) =>
      (state.cat === 'all' || p.cat === state.cat) &&
      (!q || `${p.name} ${p.color}`.toLowerCase().includes(q)));
  }

  /* =========================================================
     Rack rendering
     ========================================================= */
  const items = [];
  const rack = $('#rack');

  function swapRack() {
    if (mqReduce.matches) { renderRack(false); return; }
    rack.classList.add('leaving');
    $('#rackTitle').style.opacity = 0;
    setTimeout(() => { rack.classList.remove('leaving'); renderRack(true); $('#rackTitle').style.opacity = 1; }, 210);
  }

  function renderRack(animate) {
    const list = visible();
    items.length = 0;
    rack.innerHTML = '';
    const cat = CATEGORIES.find((c) => c.id === state.cat);
    $('#rackTitle').textContent = cat.id === 'all' ? 'All pieces' : cat.label;
    $('#rackCount').textContent = `${list.length} ${list.length === 1 ? 'piece' : 'pieces'}`;

    if (!list.length) {
      rack.innerHTML = `<div class="empty"><p>Nothing on this rail matches “${esc(state.q)}”.</p><button class="link" id="clearSearch">Clear search</button></div>`;
      $('#clearSearch').onclick = () => { $('#searchInput').value = ''; state.q = ''; renderRack(true); };
      updateArrows();
      return;
    }

    const per = mobile ? 2 : list.length;
    let idx = 0;
    for (let i = 0; i < list.length; i += per) {
      const rail = document.createElement('div');
      rail.className = 'rail';
      rail.innerHTML = '<div class="rail-inner"><div class="pipe" aria-hidden="true"><span class="cap l"></span><span class="cap r"></span></div><div class="hangers"></div></div>';
      const hangers = rail.querySelector('.hangers');
      const railItems = [];
      list.slice(i, i + per).forEach((p) => {
        const it = makeItem(p, idx++, animate, rail);
        hangers.appendChild(it.el);
        railItems.push(it);
      });
      railItems.forEach((it, k) => { it.prev = railItems[k - 1]; it.next = railItems[k + 1]; });
      rack.appendChild(rail);
      if (!mobile) wireRailScroll(rail);
    }
    updateArrows();
  }

  function makeItem(p, idx, animate, rail) {
    const el = document.createElement('div');
    el.className = 'item' + (animate && !mqReduce.matches ? ' drop' : '');
    el.style.setProperty('--d', `${idx * 55}ms`);
    el.innerHTML = `
      <div class="hit" role="button" tabindex="0" aria-label="${esc(p.name)}, ${fmt(p.price)}. Open details">
        <div class="swing"><div class="spin">
          ${HOOK}
          <div class="face front">${garment(p, 'front', `${p.id}-f`)}</div>
          <div class="face back">${garment(p, 'back', `${p.id}-b`)}</div>
        </div></div>
        <span class="tag-focus" aria-hidden="true"></span>
      </div>
      <div class="tag"><span class="tag-name">${esc(p.name)}</span><span class="tag-price">${fmt(p.price)}</span></div>`;

    const it = {
      p, el, rail,
      hit: el.querySelector('.hit'),
      swing: el.querySelector('.swing'),
      spin: el.querySelector('.spin'),
      shades: el.querySelectorAll('.shade'),
      name: el.querySelector('.tag-name'),
      rot: 0, vel: 0, target: 0, mode: 'idle',
      sway: animate ? (idx % 2 ? 7 : -7) : 0, swayVel: 0,
      phase: idx * 1.37, hover: false, armedUntil: 0,
      last: { sway: NaN, rot: NaN, sh: NaN },
    };
    bindItem(it);
    items.push(it);
    return it;
  }

  /* =========================================================
     Interaction on a hanging piece
     ========================================================= */
  function startSpin(it) {
    if (it.mode === 'drag') return;
    it.hover = true;
    it.mode = 'spin';
    it.swayVel += (Math.random() > 0.5 ? 1 : -1) * 16;
    if (it.prev) it.prev.swayVel -= 7;
    if (it.next) it.next.swayVel += 7;
    bumpRail(it.rail);
  }
  function stopSpin(it) {
    it.hover = false;
    if (it.mode !== 'spin') return;
    const r = ((it.rot % 360) + 360) % 360;
    it.target = r < 30 ? it.rot - r : it.rot + (360 - r); // finish the turn, land on the front
    it.mode = 'settle';
  }
  function turnOnce(it) {
    it.target = Math.round(it.rot / 360) * 360 + 360;
    it.mode = 'settle';
    it.swayVel += 12;
    bumpRail(it.rail);
  }

  let bumpAt = 0;
  function bumpRail(rail) {
    if (mqReduce.matches) return;
    const now = performance.now();
    if (now - bumpAt < 380) return;
    bumpAt = now;
    const inner = rail.querySelector('.rail-inner');
    inner.classList.remove('bump');
    void inner.offsetWidth;
    inner.classList.add('bump');
  }

  function bindItem(it) {
    const h = it.hit;
    let down = null;

    h.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') startSpin(it); });
    h.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && it.mode !== 'drag') stopSpin(it); });

    h.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      down = { x: e.clientX, y: e.clientY, rot: it.rot, t: performance.now(), lastX: e.clientX, lastT: performance.now(), v: 0, moved: false, type: e.pointerType, id: e.pointerId };
    });
    h.addEventListener('pointermove', (e) => {
      if (!down || e.pointerId !== down.id) return;
      const dx = e.clientX - down.x, dy = e.clientY - down.y;
      if (!down.moved) {
        if (Math.abs(dx) < 7 || Math.abs(dx) < Math.abs(dy)) return;
        // horizontal drag rotates the piece (only where the page isn't using that gesture)
        if (down.type !== 'mouse' && !mobile) { down = null; return; }
        down.moved = true;
        it.mode = 'drag';
        try { h.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      }
      const now = performance.now();
      it.rot = down.rot + dx * 0.9;
      down.v = ((e.clientX - down.lastX) * 0.9) / Math.max(0.008, (now - down.lastT) / 1000);
      down.lastX = e.clientX; down.lastT = now;
    });
    const end = (e) => {
      if (!down || e.pointerId !== down.id) return;
      const d = down; down = null;
      if (d.moved) {
        it.vel = Math.max(-900, Math.min(900, d.v));
        it.target = Math.round((it.rot + it.vel * 0.22) / 180) * 180; // rest on front or back
        it.mode = 'settle';
        if (d.type === 'mouse' && it.hover) setTimeout(() => { if (it.hover && it.mode === 'idle') startSpin(it); }, 1400);
        return;
      }
      if (e.type === 'pointercancel') return;
      if (d.type === 'mouse') { openModal(it.p, h); return; }
      // touch / pen: first tap turns the piece, second tap opens it
      const now = performance.now();
      if (now < it.armedUntil) { it.armedUntil = 0; openModal(it.p, h); return; }
      turnOnce(it);
      it.armedUntil = now + 4000;
      flashName(it);
    };
    h.addEventListener('pointerup', end);
    h.addEventListener('pointercancel', end);

    h.addEventListener('focus', () => { if (h.matches(':focus-visible')) startSpin(it); });
    h.addEventListener('blur', () => stopSpin(it));
    h.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(it.p, h); }
    });
  }

  function flashName(it) {
    const n = it.name;
    n.textContent = 'Tap again for details';
    n.classList.add('flash');
    clearTimeout(it.flashT);
    it.flashT = setTimeout(() => { n.textContent = it.p.name; n.classList.remove('flash'); }, 2600);
  }

  /* =========================================================
     Motion loop — spin, settle, sway
     ========================================================= */
  let lastT = performance.now();
  function tick(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    const t = now / 1000;
    const rm = mqReduce.matches;

    for (const it of items) {
      if (it.mode === 'spin') {
        const sp = rm ? 80 : 165;
        it.vel += (sp - it.vel) * Math.min(1, dt * 2.6);
        it.rot += it.vel * dt;
      } else if (it.mode === 'settle') {
        const diff = it.target - it.rot;
        const acc = rm ? 500 : 300;
        const maxV = rm ? 420 : 280;
        const want = Math.sign(diff) * Math.min(maxV, Math.sqrt(2 * acc * Math.abs(diff)));
        it.vel += (want - it.vel) * Math.min(1, dt * 7);
        it.rot += it.vel * dt;
        if (Math.abs(diff) < 0.25 && Math.abs(it.vel) < 6) {
          it.rot = ((it.target % 360) + 360) % 360;
          it.target = it.rot; it.vel = 0; it.mode = 'idle';
        }
      }

      // pendulum sway around the hook
      let base = 0;
      if (!rm) {
        base = Math.sin(t * 1.05 + it.phase) * 0.8;
        if (it.mode === 'spin') base += Math.sin(t * 2.7 + it.phase) * 1.3;
      }
      it.swayVel += (19 * (base - it.sway) - 1.7 * it.swayVel) * dt;
      it.sway += it.swayVel * dt;

      // write only what changed
      const L = it.last;
      if (Math.abs(L.sway - it.sway) > 0.004 || isNaN(L.sway)) {
        it.swing.style.transform = `rotate(${it.sway.toFixed(3)}deg)`;
        L.sway = it.sway;
      }
      if (L.rot !== it.rot) {
        it.spin.style.transform = `rotateY(${it.rot.toFixed(2)}deg)`;
        L.rot = it.rot;
        const sh = +((1 - Math.abs(Math.cos((it.rot * Math.PI) / 180))) * 0.5).toFixed(3);
        if (sh !== L.sh) { it.shades.forEach((s) => s.setAttribute('opacity', sh)); L.sh = sh; }
      }
    }
    requestAnimationFrame(tick);
  }

  /* =========================================================
     Desktop rail scrolling
     ========================================================= */
  function mainRail() { return rack.querySelector('.rail'); }
  function wireRailScroll(rail) {
    rail.addEventListener('wheel', (e) => {
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
      const max = rail.scrollWidth - rail.clientWidth;
      if (max <= 0) return;
      if ((e.deltaY < 0 && rail.scrollLeft <= 0) || (e.deltaY > 0 && rail.scrollLeft >= max - 1)) return;
      e.preventDefault();
      rail.scrollLeft += e.deltaY;
    }, { passive: false });
    rail.addEventListener('scroll', updateArrows, { passive: true });
  }
  function updateArrows() {
    const r = mainRail();
    const prev = $('#prevBtn'), next = $('#nextBtn');
    if (!r || mobile) { prev.disabled = next.disabled = true; return; }
    const max = r.scrollWidth - r.clientWidth;
    prev.disabled = r.scrollLeft <= 2;
    next.disabled = r.scrollLeft >= max - 2;
    $('.rail-nav').style.visibility = max > 2 ? 'visible' : 'hidden';
  }
  const step = (dir) => { const r = mainRail(); if (r) r.scrollBy({ left: dir * 3 * 206, behavior: mqReduce.matches ? 'auto' : 'smooth' }); };
  $('#prevBtn').onclick = () => step(-1);
  $('#nextBtn').onclick = () => step(1);

  mqMobile.addEventListener('change', () => { mobile = mqMobile.matches; renderRack(false); setHint(); });
  window.addEventListener('resize', updateArrows);

  function setHint() {
    $('#hint').textContent = coarse.matches
      ? (mobile ? 'Tap a piece to turn it, tap again for details. Swipe sideways to spin it by hand.' : 'Tap a piece to turn it, tap again for details.')
      : 'Hover over a piece to turn it. Click to see it up close, or drag to spin it by hand.';
  }

  /* =========================================================
     Product details
     ========================================================= */
  const modal = $('#modal');
  const m = { p: null, size: 'M', qty: 1, rot: 0, opener: null };

  function openModal(p, opener) {
    m.p = p; m.size = 'M'; m.qty = 1; m.rot = 0; m.opener = opener || null;
    $('#vFront').innerHTML = garment(p, 'front', `m-${p.id}-f`);
    $('#vBack').innerHTML = garment(p, 'back', `m-${p.id}-b`);
    $('#mName').textContent = p.name;
    $('#mPrice').textContent = fmt(p.price);
    $('#mColor').textContent = p.color;
    $('#mDot').style.background = p.hex;
    $('#mDesc').textContent = p.desc;
    renderSizes();
    $('#qVal').textContent = 1;
    setModalRot(0, false);
    modal.hidden = false;
    document.body.style.overflow = 'hidden';
    $('.close', modal).focus();
  }
  function closeModal() {
    modal.hidden = true;
    document.body.style.overflow = '';
    if (m.opener) m.opener.focus({ preventScroll: true });
  }
  modal.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) closeModal(); });

  function renderSizes() {
    $('#sizeRow').setAttribute('role', 'radiogroup');
    $('#sizeRow').setAttribute('aria-label', 'Size');
    $('#sizeRow').innerHTML = SIZES.map((s) => `<button role="radio" aria-checked="${s === m.size}" data-size="${s}">${s}</button>`).join('');
  }
  $('#sizeRow').addEventListener('click', (e) => {
    const b = e.target.closest('[data-size]');
    if (!b) return;
    m.size = b.dataset.size;
    renderSizes();
    $(`[data-size="${m.size}"]`, $('#sizeRow')).focus();
  });
  $('#qMinus').onclick = () => { m.qty = Math.max(1, m.qty - 1); $('#qVal').textContent = m.qty; };
  $('#qPlus').onclick = () => { m.qty = Math.min(10, m.qty + 1); $('#qVal').textContent = m.qty; };

  function setModalRot(deg, animate = true) {
    m.rot = deg;
    const s = $('#vSpin');
    s.classList.toggle('dragging', !animate);
    s.style.transform = `rotateY(${deg}deg)`;
    const back = Math.round(deg / 180) % 2 !== 0;
    document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.side === 'back') === back)));
  }
  document.querySelector('.seg').addEventListener('click', (e) => {
    const b = e.target.closest('[data-side]');
    if (!b) return;
    const wantBack = b.dataset.side === 'back';
    const isBack = Math.round(m.rot / 180) % 2 !== 0;
    if (wantBack !== isBack) setModalRot(m.rot + 180);
  });

  // drag to turn in the viewer
  (function () {
    const stage = $('#vStage');
    let d = null;
    stage.addEventListener('pointerdown', (e) => { d = { x: e.clientX, y: e.clientY, rot: m.rot, id: e.pointerId, moved: false }; });
    stage.addEventListener('pointermove', (e) => {
      if (!d || e.pointerId !== d.id) return;
      const dx = e.clientX - d.x;
      if (!d.moved) {
        if (Math.abs(dx) < 5 || Math.abs(dx) < Math.abs(e.clientY - d.y)) return;
        d.moved = true;
        try { stage.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      }
      setModalRot(d.rot + dx * 0.7, false);
    });
    const end = (e) => {
      if (!d || e.pointerId !== d.id) return;
      const moved = d.moved; d = null;
      if (moved) requestAnimationFrame(() => setModalRot(Math.round(m.rot / 180) * 180, true));
    };
    stage.addEventListener('pointerup', end);
    stage.addEventListener('pointercancel', end);
  })();

  $('#addBtn').onclick = () => {
    addToCart(m.p.id, m.size, m.qty);
    toast(`Added ${m.qty > 1 ? m.qty + ' × ' : ''}${m.p.name} (${m.size}) to cart`);
    closeModal();
  };

  /* =========================================================
     Cart
     ========================================================= */
  const cartWrap = $('#cartWrap');
  function saveCart() { store.set('hangr-cart', state.cart); }
  function cartCount() { return state.cart.reduce((n, l) => n + l.qty, 0); }

  function addToCart(id, size, qty) {
    const line = state.cart.find((l) => l.id === id && l.size === size);
    if (line) line.qty = Math.min(20, line.qty + qty);
    else state.cart.push({ id, size, qty });
    saveCart();
    renderBadge(true);
    renderCart();
  }

  function renderBadge(pop) {
    const n = cartCount(), b = $('#badge');
    b.hidden = n === 0;
    b.textContent = n;
    $('#cartBtn').setAttribute('aria-label', `Cart, ${n} ${n === 1 ? 'item' : 'items'}`);
    if (pop && !mqReduce.matches) { b.classList.remove('bounce'); void b.offsetWidth; b.classList.add('bounce'); }
  }

  function renderCart() {
    const lines = $('#lines');
    const empty = state.cart.length === 0;
    $('#cartEmpty').hidden = !empty;
    $('#cartFoot').hidden = empty;
    lines.hidden = empty;
    $('#cartTitle').textContent = empty ? 'Cart' : `Cart (${cartCount()})`;
    lines.innerHTML = state.cart.map((l, i) => {
      const p = byId[l.id];
      return `<li class="line" data-i="${i}">
        <div class="line-thumb">${garment(p, 'front', `c-${p.id}-${l.size}`)}</div>
        <div>
          <p class="line-name">${esc(p.name)}</p>
          <p class="line-meta">${esc(p.color)} · Size ${l.size}</p>
          <div class="stepper sm" role="group" aria-label="Quantity for ${esc(p.name)} size ${l.size}">
            <button data-act="dec" aria-label="Decrease">−</button><output>${l.qty}</output><button data-act="inc" aria-label="Increase">+</button>
          </div>
        </div>
        <div class="line-right">
          <span class="line-price">${fmt(p.price * l.qty)}</span>
          <button class="remove" data-act="rm">Remove</button>
        </div>
      </li>`;
    }).join('');
    const sub = state.cart.reduce((s, l) => s + byId[l.id].price * l.qty, 0);
    $('#subtotal').textContent = fmt(sub);
  }

  $('#lines').addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const i = +b.closest('.line').dataset.i, l = state.cart[i];
    if (b.dataset.act === 'inc') l.qty = Math.min(20, l.qty + 1);
    if (b.dataset.act === 'dec') { l.qty -= 1; if (l.qty < 1) state.cart.splice(i, 1); }
    if (b.dataset.act === 'rm') { state.cart.splice(i, 1); toast(`Removed ${byId[l.id].name}`); }
    saveCart(); renderCart(); renderBadge(false);
    const again = $(`.line[data-i="${i}"] [data-act="${b.dataset.act}"]`);
    if (again) again.focus(); else $('[data-cart-close].icon-btn').focus();
  });

  function openCart() {
    restoreCartView();
    renderCart();
    cartWrap.hidden = false;
    document.body.style.overflow = 'hidden';
    $('[data-cart-close].icon-btn').focus();
  }
  function closeCart() {
    cartWrap.hidden = true;
    document.body.style.overflow = '';
    $('#cartBtn').focus({ preventScroll: true });
  }
  $('#cartBtn').onclick = openCart;
  cartWrap.addEventListener('click', (e) => { if (e.target.closest('[data-cart-close]')) closeCart(); });

  $('#checkoutBtn').onclick = () => {
    const n = cartCount();
    state.cart = []; saveCart(); renderBadge(false);
    $('#lines').hidden = true; $('#cartFoot').hidden = true; $('#cartEmpty').hidden = true;
    const done = document.createElement('div');
    done.className = 'done';
    done.innerHTML = `<h3>Order placed</h3><p>${n} ${n === 1 ? 'piece is' : 'pieces are'} on the way. This is a demo store, so nothing was charged.</p><button class="btn" data-cart-close>Back to the rail</button>`;
    $('#cart').appendChild(done);
    $('#cartTitle').textContent = 'Cart';
  };
  function restoreCartView() { const d = $('#cart .done'); if (d) d.remove(); }

  /* =========================================================
     Search
     ========================================================= */
  const searchBar = $('#searchBar'), searchInput = $('#searchInput');
  $('#searchBtn').onclick = () => {
    const open = searchBar.hidden;
    searchBar.hidden = !open;
    $('#searchBtn').setAttribute('aria-expanded', String(open));
    if (open) searchInput.focus();
    else if (state.q) { searchInput.value = ''; state.q = ''; renderRack(true); }
  };
  let qT;
  searchInput.addEventListener('input', () => {
    clearTimeout(qT);
    qT = setTimeout(() => { state.q = searchInput.value; renderRack(true); }, 160);
  });

  /* =========================================================
     Account (local demo)
     ========================================================= */
  const pop = $('#accountPop');
  function renderAccount() {
    const u = state.user;
    const ini = $('#initial');
    ini.hidden = !u;
    if (u) ini.textContent = u.charAt(0).toUpperCase();
    pop.innerHTML = u
      ? `<h3>Hi, ${esc(u)}</h3><p>You're signed in on this device.</p><button class="btn" id="signOut" style="width:100%">Sign out</button>`
      : `<h3>Sign in</h3><p>Demo account. Your name stays on this device.</p><label class="sr" for="nameIn">Your name</label><input id="nameIn" placeholder="Your name" autocomplete="given-name"><button class="btn primary" id="signIn">Sign in</button>`;
    const si = $('#signIn', pop), so = $('#signOut', pop), ni = $('#nameIn', pop);
    if (si) {
      const go = () => { const v = ni.value.trim(); if (!v) { ni.focus(); return; } state.user = v; store.set('hangr-user', v); renderAccount(); toast(`Signed in as ${v}`); togglePop(false); };
      si.onclick = go;
      ni.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    }
    if (so) so.onclick = () => { state.user = null; store.set('hangr-user', null); renderAccount(); toast('Signed out'); togglePop(false); };
  }
  function togglePop(force) {
    const open = force != null ? force : pop.hidden;
    pop.hidden = !open;
    $('#accountBtn').setAttribute('aria-expanded', String(open));
    if (open) { const f = $('input, button', pop); if (f) f.focus(); }
  }
  $('#accountBtn').onclick = (e) => { e.stopPropagation(); togglePop(); };
  document.addEventListener('click', (e) => { if (!pop.hidden && !e.target.closest('.account-wrap')) togglePop(false); });

  /* =========================================================
     Toast, keyboard
     ========================================================= */
  let toastT;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove('show'), 2200);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!modal.hidden) closeModal();
    else if (!cartWrap.hidden) closeCart();
    else if (!pop.hidden) togglePop(false);
    else if (!searchBar.hidden) $('#searchBtn').click();
  });

  /* ---------- go ---------- */
  renderCats();
  renderRack(true);
  renderBadge(false);
  renderCart();
  renderAccount();
  setHint();
  requestAnimationFrame(tick);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateArrows);
})();

</script>
</body>
</html>
